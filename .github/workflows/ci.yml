# CI for compose-cobblemon: L1 and L2 on every push and pull request, a GitHub
# Release with the mrpack on every vX.Y.Z tag, L3/L4 on manual dispatch.
# Actions are pinned by commit SHA; tool images are pinned inside the scripts.
name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per ref at a time; a newer push to the same branch cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Baked into the client pack's server list at export time. Set them as
  # repository secrets (Settings > Secrets and variables > Actions > Secrets),
  # so a repository created from this template builds its own pack. When
  # unset (branch builds without secrets, pull requests from forks),
  # scripts/lib.sh falls back to the placeholders in .env.example; tag builds
  # refuse the placeholder.
  SERVER_NAME: ${{ secrets.SERVER_NAME }}
  SERVER_PUBLIC_HOST: ${{ secrets.SERVER_PUBLIC_HOST }}

jobs:
  lint:
    name: L1 lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/lint.sh

  validate:
    name: L1 compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create .env from the example
        run: |
          cp .env.example .env
          sed -i "s/^UID=.*/UID=$(id -u)/; s/^GID=.*/GID=$(id -g)/; s/^RCON_PASSWORD=.*/RCON_PASSWORD=$(openssl rand -hex 24)/" .env
      - run: docker compose config -q
      - run: docker compose -f compose.yaml -f compose.staging.yaml config -q

  pack:
    name: L2 export and inspect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create .env from the example
        run: |
          cp .env.example .env
          sed -i "s/^UID=.*/UID=$(id -u)/; s/^GID=.*/GID=$(id -g)/; s/^RCON_PASSWORD=.*/RCON_PASSWORD=$(openssl rand -hex 24)/" .env
      - name: Build the tools image
        run: docker compose --profile tools build
      - name: packwiz refresh must be a no-op
        run: |
          docker compose --profile tools run --rm -T packwiz refresh
          git diff --exit-code pack/
      - name: Export and inspect
        run: scripts/pack-export.sh && scripts/pack-inspect.sh
      - name: Version contract
        run: scripts/version-check.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mrpack
          path: dist/*.mrpack
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, validate, pack]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Tag must match the pack version
        run: scripts/version-check.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mrpack
          path: dist
      - name: Create the release with the mrpack attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mrpack="dist/cobblemon-${GITHUB_REF_NAME#v}.mrpack"
          test -f "$mrpack" || { echo "missing $mrpack: the pack job did not export the tagged version" >&2; exit 1; }
          notes="$(grep -F "| ${GITHUB_REF_NAME#v} |" docs/releases.md || true)"
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          # shellcheck disable=SC2086  # $prerelease is either empty or one flag
          gh release create "$GITHUB_REF_NAME" "$mrpack" $prerelease \
            --title "$GITHUB_REF_NAME" --notes "${notes:-Release $GITHUB_REF_NAME}"

  smoke:
    name: L3 and L4 on a hosted runner (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create .env for a throwaway server
        run: |
          cp .env.example .env
          sed -i "s/^UID=.*/UID=$(id -u)/; s/^GID=.*/GID=$(id -g)/; s/^MEMORY=.*/MEMORY=4G/; s/^PAUSE_IF_NO_PLAYERS=.*/PAUSE_IF_NO_PLAYERS=false/" .env
          sed -i "s/^RCON_PASSWORD=.*/RCON_PASSWORD=$(openssl rand -hex 24)/" .env
      - run: docker compose --profile tools build
      - run: scripts/pack-export.sh
      - run: scripts/smoke.sh
      - run: scripts/persist-test.sh
      - run: scripts/restore-drill.sh
      - if: always()
        run: docker compose down -v
