# CI for compose-cobblemon: L1 and L2 on every push and pull request, with a
# dry run of the pack publish; L3/L4 on manual dispatch or a smoke/* branch.
# Actions are pinned by commit SHA; tool images are pinned inside the scripts.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per ref at a time; a newer push to the same branch cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Baked into the client pack's server list at export time. Set them as
  # repository secrets (Settings > Secrets and variables > Actions > Secrets),
  # so a repository created from this template builds its own pack. When
  # unset (branch builds without secrets, pull requests from forks),
  # scripts/lib.sh falls back to the placeholders in .env.example; the build
  # that publishes the pack refuses the placeholder host.
  SERVER_NAME: ${{ secrets.SERVER_NAME }}
  SERVER_PUBLIC_HOST: ${{ secrets.SERVER_PUBLIC_HOST }}
  # Compose reads PACK_VERSION from the version file, as on a deployment.
  # scripts/ci-env.sh writes .env and, when no pack is committed yet,
  # dist/cobblemon.env; every job that runs Compose runs it first.
  COMPOSE_ENV_FILES: .env,dist/cobblemon.env

jobs:
  lint:
    name: L1 lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # the repo is bind-mounted into tool containers
      - run: scripts/lint.sh

  validate:
    name: L1 compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # the repo is bind-mounted into tool containers
      - run: scripts/ci-env.sh
      - run: docker compose config -q
      - run: docker compose -f compose.yaml -f compose.staging.yaml config -q

  pack:
    name: L2 export and inspect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # the repo is bind-mounted into tool containers
      - run: scripts/ci-env.sh
      - name: Version contract (pack.toml holds only the placeholder; .env.example sets no PACK_VERSION)
        run: scripts/version-check.sh
      - name: Build the tools image
        run: docker compose --profile tools build
      - name: packwiz refresh must be a no-op
        run: |
          docker compose --profile tools run --rm -T packwiz refresh
          git diff --exit-code pack/
      - name: Export and inspect the pack for the pushed commit
        run: |
          # Two statements, so a failing helper fails the step instead of passing an empty version.
          version="$(bash -c '. scripts/lib.sh && commit_version')"
          scripts/pack-export.sh "$version"
          scripts/pack-inspect.sh --expect "$version"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mrpack
          path: |
            dist/cobblemon.mrpack
            dist/cobblemon.env
          if-no-files-found: error
      - name: Publish dry run (would merging this commit publish a new pack?)
        run: scripts/pack-publish.sh --dry-run

  smoke:
    # Manual dispatch (needs the workflow on the default branch), or push a branch
    # named smoke/<anything> to run L3 and L4 on a hosted Linux runner from any ref.
    name: L3 and L4 on a hosted runner (manual or smoke/* branch)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/smoke/')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # the repo is bind-mounted into tool containers
      - run: scripts/ci-env.sh MEMORY=4G PAUSE_IF_NO_PLAYERS=false
      - run: mkdir -p data backups/keep dist && chmod 750 data backups   # as the admin guide says
      - run: docker compose --profile tools build
      - run: scripts/pack-export.sh
      - run: scripts/smoke.sh
      - run: scripts/persist-test.sh
      - run: scripts/restore-drill.sh
      - if: always()
        run: docker compose down -v
