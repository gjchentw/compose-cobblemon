# CI for compose-cobblemon: L1 and L2 on every push and pull request; when a
# GitHub release is published, the pack is built for its tag and attached to
# it; L3/L4 on manual dispatch or a smoke/* branch.
# Actions are pinned by commit SHA; tool images are pinned inside the scripts.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # Publishing a release (web UI or `gh release create`) with a new tag vX.Y.Z
  # is the whole release procedure: the tag is the version.
  release:
    types: [published]

permissions:
  contents: read

# One run per ref at a time; a newer push to the same branch cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Baked into the client pack's server list at export time. Set them as
  # repository secrets (Settings > Secrets and variables > Actions > Secrets),
  # so a repository created from this template builds its own pack. When
  # unset (branch builds without secrets, pull requests from forks),
  # scripts/lib.sh falls back to the placeholders in .env.example; release
  # builds refuse the placeholder host.
  SERVER_NAME: ${{ secrets.SERVER_NAME }}
  SERVER_PUBLIC_HOST: ${{ secrets.SERVER_PUBLIC_HOST }}

jobs:
  lint:
    name: L1 lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # the repo is bind-mounted into tool containers
      - run: scripts/lint.sh

  validate:
    name: L1 compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # the repo is bind-mounted into tool containers
      - run: scripts/ci-env.sh
      - run: docker compose config -q
      - run: docker compose -f compose.yaml -f compose.staging.yaml config -q

  pack:
    name: L2 export and inspect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # the repo is bind-mounted into tool containers
      - run: scripts/ci-env.sh
      - name: Build the tools image
        run: docker compose --profile tools build
      - name: packwiz refresh must be a no-op
        run: |
          docker compose --profile tools run --rm -T packwiz refresh
          git diff --exit-code pack/
      - name: Export and inspect
        run: scripts/pack-export.sh && scripts/pack-inspect.sh
      - name: Version contract
        run: scripts/version-check.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mrpack
          path: dist/*.mrpack
          if-no-files-found: error

  release:
    name: Build the pack for the published release
    if: github.event_name == 'release'
    needs: [lint, validate, pack]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # the repo is bind-mounted into tool containers
      - run: scripts/ci-env.sh
      - name: Version from the release tag (vX.Y.Z or vX.Y.Z-rc.N)
        id: version
        run: echo "version=$(scripts/version-check.sh "$TAG")" >> "$GITHUB_OUTPUT"
      - name: Build the tools image
        run: docker compose --profile tools build
      - name: Export and inspect the pack for this version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PACK_REQUIRE_REAL_HOST: "1"
        run: |
          scripts/pack-export.sh "$VERSION"
          scripts/pack-inspect.sh "dist/cobblemon-$VERSION.mrpack"
      - name: Attach the pack to the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release upload "$TAG" "dist/cobblemon-$VERSION.mrpack" --clobber
      - name: Add the pack contents to the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          body="$(gh release view "$TAG" --json body --jq .body)"
          case "$body" in *"<!-- pack-contents -->"*) echo "notes already carry the table"; exit 0 ;; esac
          minecraft="$(sed -n 's/^minecraft = "\(.*\)"$/\1/p' pack/pack.toml)"
          fabric="$(sed -n 's/^fabric = "\(.*\)"$/\1/p' pack/pack.toml)"
          cobblemon="$(sed -n 's/^filename = "Cobblemon-fabric-\(.*\)+.*"$/\1/p' pack/mods/cobblemon.pw.toml)"
          image="$(sed -n 's/^ *image: docker.io\/itzg\/minecraft-server:\([^@]*\)@.*$/\1/p' compose.yaml)"
          {
            printf '%s\n\n' "$body"
            printf '<!-- pack-contents -->\n'
            printf '| Pack | Minecraft | Fabric loader | Cobblemon | Server image |\n|---|---|---|---|---|\n'
            printf '| %s | %s | %s | %s | %s |\n\n' "$VERSION" "$minecraft" "$fabric" "$cobblemon" "$image"
            # shellcheck disable=SC2016  # the backticks are markdown, not command substitution
            printf 'Players: install `cobblemon-%s.mrpack`. Admins: check out `%s`, set `PACK_VERSION=%s` in `.env`, put the file in `dist/`.\n' \
              "$VERSION" "$TAG" "$VERSION"
          } > notes.md
          gh release edit "$TAG" --notes-file notes.md

  smoke:
    # Manual dispatch (needs the workflow on the default branch), or push a branch
    # named smoke/<anything> to run L3 and L4 on a hosted Linux runner from any ref.
    name: L3 and L4 on a hosted runner (manual or smoke/* branch)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/smoke/')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # the repo is bind-mounted into tool containers
      - run: scripts/ci-env.sh MEMORY=4G PAUSE_IF_NO_PLAYERS=false
      - run: mkdir -p data backups/keep dist && chmod 750 data backups   # as the admin guide says
      - run: docker compose --profile tools build
      - run: scripts/pack-export.sh
      - run: scripts/smoke.sh
      - run: scripts/persist-test.sh
      - run: scripts/restore-drill.sh
      - if: always()
        run: docker compose down -v
